services:
  # PostgreSQL Database
  postgres:
    image: docker.1ms.run/library/postgres:15-alpine
    container_name: tools_platform_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tools_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tools_network

  # FastAPI Backend
  api:
    build: .
    container_name: tools_platform_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 6666 --reload
    ports:
      - "6666:6666"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/tools_platform
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tools_network

  # React Frontend
  web:
    image: docker.1ms.run/library/node:18-alpine
    container_name: tools_platform_web
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 1234"
    ports:
      - "1234:1234"
    volumes:
      - ./web-react:/app
    environment:
      - VITE_API_BASE_URL=http://api:6666/api
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - tools_network

networks:
  tools_network:
    driver: bridge

volumes:
  postgres_data:
